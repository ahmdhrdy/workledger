[project]
name = "workledger"
version = "0.3.0"
description = "Standalone camera-event attendance and payroll application"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "argon2-cffi>=23.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2025.1",
  "opencv-python-headless>=4.10,<5",
  "openvino>=2025.0,<2027",
  "numpy>=1.26,<3",
  "cryptography>=44",
  "python-multipart>=0.0.18",
  "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
